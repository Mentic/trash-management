# Sec. 11 — la fiecare push: typecheck, teste, validatorul setului demo, migrări pe Postgres real, build,
# apoi scenariile end-to-end pe build-ul de producție.
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: app_admin, POSTGRES_PASSWORD: ci, POSTGRES_DB: adi }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_admin -d adi" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validator set de date demo
        run: python3 -I seed/validate_seed.py seed
      - name: Migrări pe PostgreSQL 17
        env: { DATABASE_ADMIN_URL: "postgres://app_admin:ci@localhost:5432/adi" }
        run: pnpm db:migrate
      - run: pnpm build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    # Imaginea oficială Playwright: Chromium și bibliotecile lui sunt deja instalate,
    # deci jobul nu depinde de serverele de pachete Ubuntu. Versiunea = cea din package.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: app_admin, POSTGRES_PASSWORD: ci, POSTGRES_DB: adi }
        options: >-
          --health-cmd "pg_isready -U app_admin -d adi" --health-interval 5s --health-retries 20
    env:
      PG_ADMIN_BASE: postgres://app_admin:ci@postgres:5432
      APP_RW_PASSWORD: rw
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
