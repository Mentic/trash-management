# Sec. 17.4 — deploy manual pe VPS: imagine în GHCR, apoi docker compose pe server prin SSH.
# Secrete necesare: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, PROD_ENV (conținutul fișierului .env).
name: Deploy demo
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }},ghcr.io/${{ github.repository }}:latest
          build-args: APP_VERSION=${{ github.sha }}
      - name: Copiază fișierele de rulare pe server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "compose.yml,Caddyfile,docker/db-init.sh"
          target: /opt/adi-demo
      - name: Pornește noua versiune
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          IMAGE: ${{ env.IMAGE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PROD_ENV,IMAGE,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            cd /opt/adi-demo
            umask 077 && printf '%s\n' "$PROD_ENV" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            APP_IMAGE="$IMAGE" docker compose pull app
            APP_IMAGE="$IMAGE" docker compose up -d
            APP_IMAGE="$IMAGE" docker compose exec -T app node migrator/migrate.mjs
            APP_IMAGE="$IMAGE" docker compose exec -T app node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1))"
