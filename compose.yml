# Sec. 3 — trei servicii, pe orice VPS Linux cu Docker (independent de furnizor).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: adi
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d adi"]
      interval: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-ghcr.io/ionutvacariu/trash-management:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - files:/data/files

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  files:
  caddy_data:
